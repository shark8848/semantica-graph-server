# Semantica Graph Engine Docker 栈：单镜像（图引擎 + HAProxy 代理层同容器）
#
# 使用：
#   1) bash scripts/build_docker.sh        # 构建镜像
#   2) docker compose up -d                # 启动
#   3) curl -s http://127.0.0.1:18180/health
#   4) gRPC 客户端直连 127.0.0.1:18151（HAProxy TCP 透传）
#   5) HAProxy stats: http://127.0.0.1:8406/（HAPROXY_STATS_USER / HAPROXY_STATS_PASSWORD）
#
# 拓扑：宿主机 -> HAProxy(:8080 HTTP / :50051 gRPC / :8404 stats)
#              -> graph-engine(127.0.0.1:18010 / 127.0.0.1:50051，仅回环，不对外)
#              -> 宿主本地 redis(Celery broker/backend，经 host.docker.internal 访问，不启动 redis 容器)
# 升级旧镜像：先 bash scripts/build_docker.sh，再 docker compose up -d --build（避免复用旧 tag 镜像）
# 生产必改：HAPROXY_STATS_PASSWORD。
# Celery：compose 默认启用并指向【宿主本地 redis】（host.docker.internal:6379，密码默认
# 1qaz2wsx3edc）。不启动任何 redis 容器。可用 .env 覆写：
#   - CELERY_BROKER_URL：完整 broker/backend URL（默认 redis://:1qaz2wsx3edc@host.docker.internal:6379/0）
#   - GRAPH_ENGINE_CELERY_BROKER / ..._BACKEND：分别覆写（优先级最高）
# 注意：宿主 redis 需监听 0.0.0.0 并开启密码，engine 容器才能经 host.docker.internal 访问。

name: graph-engine

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: graph-engine:0.1.0
    restart: unless-stopped
    extra_hosts:
      # 让容器内经 host.docker.internal 访问宿主本地 redis（host-gateway 映射宿主网关 IP）
      - "host.docker.internal:host-gateway"
    environment:
      # 引擎
      GRAPH_ENGINE_DB_PATH: "${GRAPH_ENGINE_DB_PATH:-data/engine.db}"
      GRAPH_ENGINE_SEMANTICA: "${GRAPH_ENGINE_SEMANTICA:-1}"
      GRAPH_ENGINE_LOG_LEVEL: "${GRAPH_ENGINE_LOG_LEVEL:-INFO}"
      # Celery worker：compose 栈默认启用，broker/backend 指向宿主本地 redis（带密码）。
      # docker run 单容器默认仍为关闭（entrypoint 内 GRAPH_ENGINE_CELERY_ENABLED 缺省 0），
      # 此处显式传 1 仅影响 compose 栈；单容器启用需自备可达 broker/backend。
      GRAPH_ENGINE_CELERY_ENABLED: "${GRAPH_ENGINE_CELERY_ENABLED:-1}"
      # 默认指向宿主本地 redis；可在 .env 用 CELERY_BROKER_URL 一键覆写（如换另一台 Redis），
      # 或分别用 GRAPH_ENGINE_CELERY_BROKER / ..._BACKEND 精调。
      GRAPH_ENGINE_CELERY_BROKER: "${GRAPH_ENGINE_CELERY_BROKER:-${CELERY_BROKER_URL:-redis://:1qaz2wsx3edc@host.docker.internal:6379/0}}"
      GRAPH_ENGINE_CELERY_BACKEND: "${GRAPH_ENGINE_CELERY_BACKEND:-${CELERY_BROKER_URL:-redis://:1qaz2wsx3edc@host.docker.internal:6379/0}}"
      # HAProxy stats 登录账号（默认 admin / change-me，生产必改）
      HAPROXY_STATS_USER: "${HAPROXY_STATS_USER:-admin}"
      HAPROXY_STATS_PASSWORD: "${HAPROXY_STATS_PASSWORD:-change-me}"
    ports:
      - "${HAPROXY_HTTP_PORT:-18180}:8080"
      - "${HAPROXY_GRPC_PORT:-18151}:50051"
      - "${HAPROXY_STATS_PORT:-8406}:8404"
    volumes:
      - engine_data:/app/data
      - engine_logs:/app/logs
    healthcheck:
      # 经 HAProxy 探测（端到端：HAProxy -> 引擎 127.0.0.1:18010）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  engine_data:
  engine_logs:
