[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-engine"
version = "0.1.0"
description = "Semantica-backed graph engine exposing HTTP/gRPC/Celery/MCP/CLI interfaces"
requires-python = ">=3.12"
dependencies = [
  # 核心依赖复用当前 venv 已装包；RDF/SPARQL 视图经 semantica 的
  # tripletstore-oxigraph extra 声明 pyoxigraph（venv 已装 0.5.9）
  "semantica[tripletstore-oxigraph]==0.6.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  # 跨层共享模型/协议 SDK（跨仓归位契约）：图谱资产对象（G8）、traceId 纯函数（G2）、
  # 引擎作业视图与状态映射（G3）的**字段形状单一来源**。本地 wheel 安装：
  #   pip install /home/sharkyai/ikc-sdk-lib/dist/ikc_sdk_lib-0.7.0-py3-none-any.whl
  "ikc-sdk-lib==0.7.0",
  "grpcio>=1.81",
  "protobuf>=5.29",
  "celery>=5.3",
  "typer>=0.12",
]

[project.scripts]
graph-engine = "graph_engine.interfaces.cli:app"

[project.optional-dependencies]
test = [
  # starlette 1.6+ 的 TestClient 已弃用 httpx，需用 httpx2
  "httpx2>=2.12",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
