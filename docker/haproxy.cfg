# ============================================================================
# HAProxy 代理层配置（与图引擎同一镜像，容器内反向代理）
#
# 拓扑（容器内）：client -> HAProxy(:8080 HTTP / :50051 gRPC / :8404 stats)
#                         -> graph-engine HTTP(127.0.0.1:18010) / gRPC(127.0.0.1:50051)
# 说明：
#   - 入口用高位端口，避免非 root（uid 1000）绑定特权端口对运行时内核参数的依赖；
#     宿主端口由 docker compose 映射（默认 18180 -> 8080、18151 -> 50051、8406 -> 8404）。
#   - HTTP 后端健康探测走引擎 /health；gRPC 后端为 TCP 透传（HTTP/2 直通）。
#   - 引擎内部端口与 stats 凭据为模板变量，由 docker/entrypoint.sh 用 envsubst 渲染
#     （默认 GRAPH_ENGINE_HTTP_PORT=18010 / GRAPH_ENGINE_GRPC_PORT=50051），修改需重建镜像。
#
# 安全说明：
#   - 引擎 HTTP/gRPC 仅监听 127.0.0.1，对外不直接暴露，唯一入口为 HAProxy；
# ============================================================================

global
  log stdout format raw local0 notice
  maxconn 4096

defaults
  log global
  mode http
  option dontlognull
  timeout connect 5s
  timeout client 30s
  timeout server 60s
  timeout http-keep-alive 10s

# ---------- HTTP 入口（引擎 REST API） ----------
frontend http
  bind *:8080
  option httplog
  option http-server-close
  option forwardfor if-none
  default_backend graph_engine_http

  http-response set-header X-Content-Type-Options nosniff
  http-response set-header X-Frame-Options SAMEORIGIN
  http-response set-header Referrer-Policy strict-origin-when-cross-origin

backend graph_engine_http
  option httpchk GET /health
  server engine 127.0.0.1:${GRAPH_ENGINE_HTTP_PORT} check inter 3s fall 3 rise 2 maxconn 1024

# ---------- gRPC 入口（HTTP/2 TCP 透传） ----------
frontend grpc
  bind *:50051
  mode tcp
  default_backend graph_engine_grpc

backend graph_engine_grpc
  mode tcp
  server engine 127.0.0.1:${GRAPH_ENGINE_GRPC_PORT} check inter 3s fall 3 rise 2

# ---------- HAProxy 监控（stats） ----------
listen stats
  bind *:8404
  mode http
  stats enable
  stats hide-version
  stats realm HAProxy\ Statistics
  stats uri /
  stats refresh 5s
  stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}
