[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantica-graph-sdk"
version = "0.1.0"
description = "Semantica Graph Engine 独立承载服务应用集成 SDK（图谱 CRUD / 建图合并 / 查询分析 / RDF 导出与 SPARQL / 异步任务）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["semantica_graph_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
